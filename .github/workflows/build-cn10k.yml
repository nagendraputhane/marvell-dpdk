name: build-cn10k

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].0'
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write
  id-token: write
  packages: write

env:
  COMPONENT: dpdk
  TVM_REPO_URL:      "https://github.com/MarvellEmbeddedProcessors/tvm.git"
  TVM_REF:           "master"
  TVMDP_REPO_URL:    "https://github.com/MarvellEmbeddedProcessors/tvmdp.git"
  TVMDP_REF:         "main"
  LIBMLDPC_REPO_URL: "https://github.com/MarvellEmbeddedProcessors/libmldpc.git"
  LIBMLDPC_REF:      "main"

jobs:
  ubuntu-cn10k-build:
    name: ubuntu-cn10k-arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout DPDK sources
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          path: dpdk

      - name: Checkout TVM
        run: git clone --recurse-submodules --depth=1 -b "${TVM_REF}" "${TVM_REPO_URL}" tvm-src

      - name: Checkout TVMDP
        run: git clone --depth=1 -b "${TVMDP_REF}" "${TVMDP_REPO_URL}" tvmdp-src

      - name: Checkout libmldpc
        run: git clone --depth=1 -b "${LIBMLDPC_REF}" "${LIBMLDPC_REPO_URL}" libmldpc-src

      - name: Generate cache keys
        id: get_ref_keys
        run: echo 'ccache=ccache-'$(date -u +%Y-%m) >> $GITHUB_OUTPUT

      - name: Retrieve ccache cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.ccache
          key: ${{ steps.get_ref_keys.outputs.ccache }}-${{ github.ref }}
          restore-keys: |
            ${{ steps.get_ref_keys.outputs.ccache }}-refs/heads/main

      - name: Install build dependencies
        run: |
          set -x
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -q -y
          sudo apt-get install -y \
            build-essential ccache git software-properties-common \
            libarchive-dev libbsd-dev libbpf-dev \
            libfdt-dev libjansson-dev \
            libssl-dev ninja-build pkg-config python3-pip \
            python3-pyelftools python3-setuptools python3-wheel \
            zlib1g-dev meson gcc gcc-14 g++-14 cmake
          mkdir -p ~/.ccache
          echo "cache_dir = ~/.ccache" > ~/.ccache/ccache.conf

      - name: Set up build paths
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/tvm-prefix \
                   ${GITHUB_WORKSPACE}/build-tree \
                   ${GITHUB_WORKSPACE}/artifacts
          echo "TVM_PREFIX=${GITHUB_WORKSPACE}/tvm-prefix" >> $GITHUB_ENV
          echo "BUILD_TREE=${GITHUB_WORKSPACE}/build-tree" >> $GITHUB_ENV

      - name: Build dlpack
        run: |
          set -x
          export CC=gcc-14 CXX=g++-14
          cmake -S tvm-src/3rdparty/dlpack -B ${BUILD_TREE}/dlpack \
            -DCMAKE_INSTALL_PREFIX=${TVM_PREFIX} \
            -DCMAKE_C_FLAGS="-w" \
            -DCMAKE_CXX_FLAGS="-w" \
            -DBUILD_MOCK=OFF
          cmake --build ${BUILD_TREE}/dlpack -j$(nproc)
          cmake --install ${BUILD_TREE}/dlpack

      - name: Build dmlc-core
        run: |
          set -x
          export CC=gcc-14 CXX=g++-14
          cmake -S tvm-src/3rdparty/dmlc-core -B ${BUILD_TREE}/dmlc-core \
            -DCMAKE_INSTALL_PREFIX=${TVM_PREFIX} \
            -DCMAKE_C_FLAGS="-w" \
            -DCMAKE_CXX_FLAGS="-w" \
            -DUSE_OPENMP=OFF
          cmake --build ${BUILD_TREE}/dmlc-core -j$(nproc)
          cmake --install ${BUILD_TREE}/dmlc-core

      - name: Build TVM
        run: |
          set -x
          export CC=gcc-14 CXX=g++-14
          cmake -S tvm-src -B ${BUILD_TREE}/tvm \
            -DCMAKE_INSTALL_PREFIX=${TVM_PREFIX} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-w -Wno-incompatible-pointer-types" \
            -DCMAKE_CXX_FLAGS="-w" \
            -DUSE_MRVL=ON \
            -DUSE_RPC=ON \
            -DUSE_CPP_RPC=ON \
            -DUSE_GRAPH_EXECUTOR=ON \
            -DUSE_PROFILER=ON \
            -DUSE_RANDOM=ON \
            -DUSE_SORT=ON \
            -DUSE_MICRO=ON \
            -DUSE_MICRO_STANDALONE_RUNTIME=ON \
            -DUSE_LLVM=OFF \
            -DUSE_LIBBACKTRACE=AUTO \
            -DBUILD_STATIC_RUNTIME=OFF \
            -DUSE_ALTERNATIVE_LINKER=OFF \
            -DSUMMARIZE=ON
          cmake --build ${BUILD_TREE}/tvm -j$(nproc)
          cmake --install ${BUILD_TREE}/tvm
          # tvm_rpc isn't part of the install rule (per Srikanth's script).
          cp -v ${BUILD_TREE}/tvm/tvm_rpc ${TVM_PREFIX}/bin/ 2>/dev/null || true

      - name: Build TVMDP
        run: |
          set -x
          export CC=gcc-14 CXX=g++-14
          export PKG_CONFIG_PATH=${TVM_PREFIX}/lib/pkgconfig
          export CMAKE_PREFIX_PATH=${TVM_PREFIX}/lib/cmake/dlpack:${TVM_PREFIX}/lib/cmake/dmlc:${TVM_PREFIX}/lib/cmake/tvm
          cmake -S tvmdp-src -B ${BUILD_TREE}/tvmdp \
            -DCMAKE_INSTALL_PREFIX=${TVM_PREFIX} \
            -DCMAKE_FIND_ROOT_PATH=${TVM_PREFIX} \
            -DBUILD_SHARED_LIBS=ON
          cmake --build ${BUILD_TREE}/tvmdp -j$(nproc)
          cmake --install ${BUILD_TREE}/tvmdp

      - name: Verify TVM/TVMDP build outputs
        run: |
          ls -la ${TVM_PREFIX}/lib/libtvm_runtime.so* \
                 ${TVM_PREFIX}/lib/libtvmdp.so* 2>/dev/null || true
          test -f ${TVM_PREFIX}/lib/libtvm_runtime.so
          test -f ${TVM_PREFIX}/lib/libtvmdp.so

      - name: Extract version details
        id: version
        run: |
          set -x
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "push" ]; then
              PKG_POSTFIX=""
              IS_DEVEL=false
          else
              PKG_POSTFIX="-devel"
              IS_DEVEL=true
          fi
          {
            echo "PKG_POSTFIX=${PKG_POSTFIX}"
            echo "IS_DEVEL=${IS_DEVEL}"
            echo "COMPONENT=${COMPONENT}"
          } >> ${GITHUB_WORKSPACE}/artifacts/env

      - name: Build DPDK and generate package
        id: build
        run: |
          set -x
          source ${GITHUB_WORKSPACE}/artifacts/env

          export CC='ccache gcc-14'
          ccache -p

          export PKG_CONFIG_PATH=${TVM_PREFIX}/lib/pkgconfig
          export CMAKE_PREFIX_PATH=${TVM_PREFIX}/lib/cmake/tvm:${TVM_PREFIX}/lib/cmake/dlpack:${TVM_PREFIX}/lib/cmake/dmlc:${TVM_PREFIX}/lib/cmake/tvmdp

          cd dpdk
          meson build \
            -Dbuildtype=release \
            -Dexamples=all \
            -Denable_drivers="*/cnxk,raw/cnxk_emdev,net/ring,net/tap" \
            -Dplatform=cn10k \
            -Denable_iova_as_pa=false \
            --prefix="${PWD}/install"
          ninja install -C build

          # Hard fail if TVM didn't actually link in.
          ML_DRIVER=$(find install -name 'librte_ml_cnxk.so*' -type f | head -1)
          if [ -z "$ML_DRIVER" ] || ! ldd "$ML_DRIVER" | grep -qE 'tvm|dmlc'; then
            echo "ERROR: librte_ml_cnxk.so does not link against TVM."
            echo "Investigate build/meson-logs/meson-log.txt."
            exit 1
          fi

          # Existing pkg-config prefix fixup, unchanged.
          sed -i "s/prefix=.*/prefix=/g" "${PWD}/install/lib/aarch64-linux-gnu/pkgconfig/libdpdk.pc"
          sed -i "s/prefix=.*/prefix=/g" "${PWD}/install/lib/aarch64-linux-gnu/pkgconfig/libdpdk-libs.pc"

          PKG_VERSION_NAME=$(cat VERSION | awk -F'.' '{print $1"."$2}')
          MRVL_PKG_VERSION=$(cat MRVL_VERSION)
          DISTRO=ubuntu-$(lsb_release -rs)

          mkdir -p "${PWD}/install/debian"
          mkdir -p "${PWD}/install/DEBIAN"
          git config --global --add safe.directory "${PWD}"
          cd "${PWD}/install"

          echo 'Source: dpdk' > debian/control
          cat > DEBIAN/control <<EOF
          Package: dpdk-${PKG_VERSION_NAME}-cn10k${PKG_POSTFIX}
          Version: ${MRVL_PKG_VERSION}
          Depends: $(dpkg-shlibdeps -O bin/dpdk-testpmd | awk -F'Depends=' '{print $2}'), libbsd-dev, libarchive-dev, libelf-dev, libjansson-dev, libacl1-dev, nettle-dev, liblzma-dev, libzstd-dev, liblz4-dev, libbz2-dev, libxml2-dev, libfdt-dev
          Recommends: tvm-runtime-cn10k${PKG_POSTFIX}
          Maintainer: Jerin Jacob (jerinj@marvell.com)
          Architecture: arm64
          Homepage: https://www.dpdk.org/
          Description: DPDK Library for Marvell Octeon 10
          EOF

          cd -
          rm -rf "${PWD}/install/~" "${PWD}/install/home"
          mv "${PWD}/install" "${PWD}/dpdk-${PKG_VERSION_NAME}-cn10k${PKG_POSTFIX}_${MRVL_PKG_VERSION}_arm64"
          dpkg --build "dpdk-${PKG_VERSION_NAME}-cn10k${PKG_POSTFIX}_${MRVL_PKG_VERSION}_arm64"
          cp "dpdk-${PKG_VERSION_NAME}-cn10k${PKG_POSTFIX}_${MRVL_PKG_VERSION}_arm64.deb" \
             ${GITHUB_WORKSPACE}/artifacts/

          # Keep the DPDK install dir around — libmldpc's build needs it.
          DPDK_INSTALL_DIR="${GITHUB_WORKSPACE}/dpdk/dpdk-${PKG_VERSION_NAME}-cn10k${PKG_POSTFIX}_${MRVL_PKG_VERSION}_arm64"
          echo "DPDK_INSTALL_DIR=${DPDK_INSTALL_DIR}" >> $GITHUB_ENV

          {
            echo "PKG_VERSION_NAME=${PKG_VERSION_NAME}"
            echo "MRVL_PKG_VERSION=${MRVL_PKG_VERSION}"
            echo "PKG_POSTFIX=${PKG_POSTFIX}"
            echo "DISTRO=${DISTRO}"
          } >> ${GITHUB_WORKSPACE}/artifacts/env

      - name: Build tvm-runtime-cn10k Debian package
        run: |
          set -x
          source ${GITHUB_WORKSPACE}/artifacts/env

          STAGING="${GITHUB_WORKSPACE}/tvm-runtime-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/usr"
          cp -a ${TVM_PREFIX}/. "$STAGING/usr/"
          mkdir -p "$STAGING/DEBIAN"

          cat > "$STAGING/DEBIAN/control" <<EOF
          Package: tvm-runtime-cn10k${PKG_POSTFIX}
          Version: ${MRVL_PKG_VERSION}
          Maintainer: Jerin Jacob (jerinj@marvell.com)
          Architecture: arm64
          Description: TVM runtime
          EOF

          DEB_NAME="tvm-runtime-cn10k${PKG_POSTFIX}_${MRVL_PKG_VERSION}_arm64"
          mv "$STAGING" "${GITHUB_WORKSPACE}/${DEB_NAME}"
          dpkg --build "${GITHUB_WORKSPACE}/${DEB_NAME}"
          cp "${GITHUB_WORKSPACE}/${DEB_NAME}.deb" ${GITHUB_WORKSPACE}/artifacts/

          echo "TVM_DEB_NAME=${DEB_NAME}" >> ${GITHUB_WORKSPACE}/artifacts/env

      - name: Build libmldpc and generate package
        run: |
          set -x
          source ${GITHUB_WORKSPACE}/artifacts/env

          export PKG_CONFIG_PATH=${DPDK_INSTALL_DIR}/lib/aarch64-linux-gnu/pkgconfig:${TVM_PREFIX}/lib/pkgconfig
          export CMAKE_PREFIX_PATH=${TVM_PREFIX}/lib/cmake/tvm:${TVM_PREFIX}/lib/cmake/dlpack:${TVM_PREFIX}/lib/cmake/dmlc:${TVM_PREFIX}/lib/cmake/tvmdp

          MLDPC_PREFIX="${GITHUB_WORKSPACE}/libmldpc-prefix"
          mkdir -p "${MLDPC_PREFIX}"

          cd libmldpc-src
          meson setup ${BUILD_TREE}/libmldpc \
            --prefix=${MLDPC_PREFIX} \
            -Dwarning_level=3
          ninja -C ${BUILD_TREE}/libmldpc install
          cd -

          STAGING="${GITHUB_WORKSPACE}/libmldpc-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/usr"
          cp -a ${MLDPC_PREFIX}/. "$STAGING/usr/"
          mkdir -p "$STAGING/DEBIAN"

          cat > "$STAGING/DEBIAN/control" <<EOF
          Package: libmldpc-cn10k${PKG_POSTFIX}
          Version: ${MRVL_PKG_VERSION}
          Depends: dpdk-$(cat ${GITHUB_WORKSPACE}/dpdk/VERSION | awk -F'.' '{print $1"."$2}')-cn10k${PKG_POSTFIX}, tvm-runtime-cn10k${PKG_POSTFIX}
          Maintainer: Jerin Jacob (jerinj@marvell.com)
          Architecture: arm64
          Description: Marvell ML Data-Plane Client library for cn10k
          EOF

          DEB_NAME="libmldpc-cn10k${PKG_POSTFIX}_${MRVL_PKG_VERSION}_arm64"
          mv "$STAGING" "${GITHUB_WORKSPACE}/${DEB_NAME}"
          dpkg --build "${GITHUB_WORKSPACE}/${DEB_NAME}"
          cp "${GITHUB_WORKSPACE}/${DEB_NAME}.deb" ${GITHUB_WORKSPACE}/artifacts/

          echo "MLDPC_DEB_NAME=${DEB_NAME}" >> ${GITHUB_WORKSPACE}/artifacts/env

      - name: Export artifact names
        id: artifacts
        run: |
          source "${GITHUB_WORKSPACE}/artifacts/env"
          echo "PKG_VERSION_NAME=${PKG_VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "MRVL_PKG_VERSION=${MRVL_PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "PKG_POSTFIX=${PKG_POSTFIX}" >> "$GITHUB_OUTPUT"
          echo "TVM_DEB_NAME=${TVM_DEB_NAME}" >> "$GITHUB_OUTPUT"
          echo "MLDPC_DEB_NAME=${MLDPC_DEB_NAME}" >> "$GITHUB_OUTPUT"
          [[ "$PKG_POSTFIX" == "-devel" ]] && TAG=devel || TAG=${MRVL_PKG_VERSION}
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "DISTRO=${DISTRO}" >> "$GITHUB_OUTPUT"

      - name: Upload DPDK debian package
        uses: actions/upload-artifact@v4.3.1
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          name: dpdk-${{ steps.artifacts.outputs.PKG_VERSION_NAME }}-cn10k${{ steps.artifacts.outputs.PKG_POSTFIX }}_${{ steps.artifacts.outputs.MRVL_PKG_VERSION }}_arm64.deb
          path: ${{ github.workspace }}/artifacts/dpdk-${{ steps.artifacts.outputs.PKG_VERSION_NAME }}-cn10k${{ steps.artifacts.outputs.PKG_POSTFIX }}_${{ steps.artifacts.outputs.MRVL_PKG_VERSION }}_arm64.deb

      - name: Upload tvm-runtime debian package
        uses: actions/upload-artifact@v4.3.1
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          name: ${{ steps.artifacts.outputs.TVM_DEB_NAME }}.deb
          path: ${{ github.workspace }}/artifacts/${{ steps.artifacts.outputs.TVM_DEB_NAME }}.deb

      - name: Upload libmldpc debian package
        uses: actions/upload-artifact@v4.3.1
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          name: ${{ steps.artifacts.outputs.MLDPC_DEB_NAME }}.deb
          path: ${{ github.workspace }}/artifacts/${{ steps.artifacts.outputs.MLDPC_DEB_NAME }}.deb

      - name: Delete existing release
        uses: liudonghua123/delete-release-action@v1
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_name: dpdk-cn10k-${{ steps.artifacts.outputs.PKG_VERSION_NAME }}_${{ steps.artifacts.outputs.MRVL_PKG_VERSION }}-${{ steps.artifacts.outputs.DISTRO }}-${{ steps.artifacts.outputs.TAG }}
          suppress_errors: true

      - name: Release DPDK + TVM + libmldpc cn10k packages
        uses: softprops/action-gh-release@v2.0.4
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          tag_name: dpdk-cn10k-${{ steps.artifacts.outputs.PKG_VERSION_NAME }}_${{ steps.artifacts.outputs.MRVL_PKG_VERSION }}-${{ steps.artifacts.outputs.DISTRO }}-${{ steps.artifacts.outputs.TAG }}
          files: |
            ${{ github.workspace }}/artifacts/dpdk-${{ steps.artifacts.outputs.PKG_VERSION_NAME }}-cn10k${{ steps.artifacts.outputs.PKG_POSTFIX }}_${{ steps.artifacts.outputs.MRVL_PKG_VERSION }}_arm64.deb
            ${{ github.workspace }}/artifacts/${{ steps.artifacts.outputs.TVM_DEB_NAME }}.deb
            ${{ github.workspace }}/artifacts/${{ steps.artifacts.outputs.MLDPC_DEB_NAME }}.deb
